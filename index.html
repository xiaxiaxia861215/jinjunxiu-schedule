<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XIA Fan Schedule Calendar</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#432439;background:#fff4f9}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#35172f,#863052 58%,#d38ca6);color:white;padding:28px 20px}header .wrap,nav .wrap{max-width:1100px;margin:auto}h1{font: bold 52px Georgia,serif;letter-spacing:5px;margin:0}header p{margin:4px 0;color:#ffe8f1}nav{background:#652747;color:white;padding:12px 18px}nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:7px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 12px;background:#f8dfe9;color:#692744}button.active{background:white;font-weight:700}main{max-width:1100px;margin:22px auto;padding:0 15px}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.panel{background:white;border:1px solid #efd3df;border-radius:16px;padding:16px;box-shadow:0 6px 18px #632d4910}.monthbar{display:flex;align-items:center;justify-content:space-between}.monthbar h2{font-size:19px;margin:0}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:15px}.weekday{text-align:center;font-size:12px;font-weight:700;padding:5px;color:#87536a}.day{min-height:77px;background:#fff7fa;border:1px solid #f1dbe5;border-radius:8px;padding:5px 3px;text-align:left;overflow:hidden}.day.blank{background:none;border:0}.day.selected{outline:2px solid #b4417b}.num{font-size:12px;font-weight:700}.chip{font-size:10px;background:#f6d7e7;border-radius:4px;padding:3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip.concert{background:#e7ddff}.chip.ticket{background:#fff0bd}.chip.broadcast{background:#dcefff}.chip.musical{background:#f8d2e2}h3{margin:2px 0 13px;font-size:18px}.event{display:flex;gap:12px;border:1px solid #f0dce6;border-radius:12px;padding:12px;margin-bottom:10px}.poster{width:60px;height:76px;border-radius:7px;flex-shrink:0;object-fit:cover;background:linear-gradient(135deg,#572040,#d88da9);display:grid;place-items:center;color:white;font:20px Georgia,serif}.event h4{font-size:14px;margin:3px 0}.event p{font-size:12px;color:#74596b;margin:5px 0}.tag{font-size:10px;color:#963963;background:#f8e1ec;padding:3px 7px;border-radius:20px}.muted{font-size:12px;color:#87677b}.admin{margin-top:17px}.admin[hidden]{display:none}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid #e6cbd7;border-radius:8px;padding:9px;background:white}textarea{min-height:65px}.editactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.editactions button{font-size:12px}.primary{background:#a83e71;color:white}.foot{text-align:center;font-size:12px;color:#896b7c;margin:22px 0}a{color:#a23b6e}@media(max-width:700px){.layout{grid-template-columns:1fr}.day{min-height:62px}.chip{font-size:9px}.formgrid{grid-template-columns:1fr}h1{font-size:42px}}
</style></head><body>
<header><div class="wrap"><h1>XIA</h1><p>KIM JUN SU · Fan Schedule Calendar</p><p style="font-size:12px">Made with love by a fan ♡</p></div></header>
<nav><div class="wrap"><strong id="navtitle">김준수 팬 일정 달력</strong><div class="actions"><button id="ko" class="active" onclick="language('ko')">KR 한국어</button><button id="zh" onclick="language('zh')">CN 简体中文</button><button id="adminBtn" onclick="toggleAdmin()">⚙ 관리자</button></div></div></nav>
<main><div class="layout"><section class="panel"><div class="monthbar"><button onclick="shift(-1)">❮</button><h2 id="monthtitle"></h2><button onclick="shift(1)">❯</button></div><div class="days" id="calendar"></div><p class="muted" id="hint"></p></section><section class="panel"><h3 id="eventtitle"></h3><div id="events"></div></section></div>
<section class="panel admin" id="editor" hidden><h3>일정 관리 · 한국어 입력</h3><p class="muted">현재는 시제품입니다. 여기서 저장한 내용은 이 브라우저에만 저장되며 팬에게 자동 공유되지 않습니다. 실제 관리자 로그인 및 공유 저장은 추후 연결해야 합니다.</p><form id="eventform"><input type="hidden" id="editid"><div class="formgrid"><div><label>일정명 (한국어) *</label><input id="titleko" required></div><div><label>일정명 (중국어 간체)</label><input id="titlezh" placeholder="번역 후 붙여넣기"></div><div><label>날짜 *</label><input id="date" type="date" required></div><div><label>시간</label><input id="time" type="time"></div><div><label>장소 (한국어)</label><input id="placeko"></div><div><label>장소 (중국어 간체)</label><input id="placezh"></div><div><label>종류</label><select id="type"><option value="concert">콘서트</option><option value="musical">뮤지컬</option><option value="broadcast">방송·행사</option><option value="ticket">티켓팅</option><option value="other">기타</option></select></div><div><label>포스터 이미지 URL</label><input id="image" type="url" placeholder="https://..."></div></div><label>설명 (한국어)</label><textarea id="descko"></textarea><label>설명 (중국어 간체)</label><textarea id="desczh"></textarea><label>상세 링크</label><input id="link" type="url" placeholder="https://..."><div class="editactions"><button class="primary" type="submit">일정 저장</button><button type="button" onclick="resetForm()">새 일정</button><button type="button" onclick="exportData()">일정 백업 JSON</button><button type="button" onclick="document.getElementById('importFile').click()">백업 불러오기</button><input type="file" id="importFile" accept="application/json" hidden onchange="importData(event)"></div><p class="muted" id="status"></p></form></section><p class="foot" id="disclaimer">팬이 개인적으로 운영하는 비공식 일정 달력입니다. 정확한 일정은 공식 공지에서 확인해 주세요.</p></main>
<script>
const KEY='xia_fan_schedule_fixed_v1';
const initial=[
{id:'d1',date:'2026-11-01',time:'14:00',titleko:'드라큘라 대구 · 김준수 막공',titlezh:'音乐剧《德古拉》大邱·金俊秀末场',placeko:'대구 (세부 공연장 확인 필요)',type:'musical',descko:'공식 공지 재확인 필요'},
{id:'e1',date:'2026-11-10',time:'14:30',titleko:'엘리자벳 · 낮 공연',titlezh:'音乐剧《伊丽莎白》午场',placeko:'서울 블루스퀘어',type:'musical',descko:'김준수 출연 회차 · 공식 출연표 확인 필요'},
{id:'e2',date:'2026-11-10',time:'19:30',titleko:'엘리자벳 · 저녁 공연',titlezh:'音乐剧《伊丽莎白》晚场',placeko:'서울 블루스퀘어',type:'musical',descko:'김준수 출연 회차 · 공식 출연표 확인 필요'},
{id:'e3',date:'2026-11-12',time:'19:30',titleko:'엘리자벳 · 김준수 막공',titlezh:'音乐剧《伊丽莎白》俊秀末场',placeko:'서울 블루스퀘어',type:'musical',descko:'김준수 기념행사 회차 · 공식 공지 확인 필요'},
{id:'j1',date:'2026-11-14',time:'17:00',titleko:'JX CORE 오사카',titlezh:'JX CORE 大阪',placeko:'Asue 아레나 오사카',placezh:'大阪 Asue Arena',type:'concert',descko:'시간은 공식 공지 확인 필요'},
{id:'j2',date:'2026-11-15',time:'17:00',titleko:'JX CORE 오사카',titlezh:'JX CORE 大阪',placeko:'Asue 아레나 오사카',placezh:'大阪 Asue Arena',type:'concert',descko:'시간은 공식 공지 확인 필요'},
{id:'k1',date:'2026-11-17',time:'',titleko:'KAIST 행사',titlezh:'KAIST 活动',placeko:'KAIST (상세 장소 확인 필요)',type:'other',descko:'시간·장소 확인 필요'},
{id:'j3',date:'2026-11-21',time:'19:00',titleko:'JX CORE 대만',titlezh:'JX CORE 台湾',placeko:'NT SU ARENA',type:'concert',descko:'시간·장소 공식 공지 재확인 필요'},
{id:'b1',date:'2026-11-22',time:'',titleko:'KBS 열린음악회 방송',titlezh:'KBS《开放音乐会》播出',placeko:'KBS',type:'broadcast',descko:'11월 22일 방송 예정 · 편성 확인 필요'},
{id:'t1',date:'2026-11-23',time:'20:00',titleko:'눈콘 선예매',titlezh:'年末演唱会 优先预售',placeko:'온라인 예매',type:'ticket',descko:'한국시간 20:00 / 중국시간 19:00 · 예매처 확인 필요'},
{id:'t2',date:'2026-11-25',time:'20:00',titleko:'눈콘 일반예매',titlezh:'年末演唱会 公开售票',placeko:'온라인 예매',type:'ticket',descko:'한국시간 20:00 / 중국시간 19:00 · 예매처 확인 필요'}
].map(x=>({titlezh:'',placezh:'',desczh:'',image:'',link:'',...x}));
let entries;try{entries=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(entries))entries=initial}catch(e){entries=initial}
let lang='ko',year=2026,month=10,selected=null,admin=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words={ko:{nav:'김준수 팬 일정 달력',days:['일','월','화','수','목','금','토'],month:(y,m)=>`${y}년 ${m+1}월`,events:'공연 · 행사 일정',empty:'등록된 일정이 없습니다.',hint:'날짜를 클릭하면 해당 날짜의 일정만 표시됩니다.',place:'장소',types:{concert:'콘서트',musical:'뮤지컬',broadcast:'방송·행사',ticket:'티켓팅',other:'기타'},disclaimer:'팬이 개인적으로 운영하는 비공식 일정 달력입니다. 정확한 일정은 공식 공지에서 확인해 주세요.'},zh:{nav:'金俊秀粉丝行程日历',days:['日','一','二','三','四','五','六'],month:(y,m)=>`${y}年 ${m+1}月`,events:'演出 · 活动日程',empty:'暂无日程。',hint:'点击日期可查看当天日程。',place:'地点',types:{concert:'演唱会',musical:'音乐剧',broadcast:'节目·活动',ticket:'售票',other:'其他'},disclaimer:'本日历由粉丝个人运营，并非官方日程。具体信息请以官方公告为准。'}};
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}function language(l){lang=l;$('ko').classList.toggle('active',l==='ko');$('zh').classList.toggle('active',l==='zh');render()}function shift(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}selected=null;render()}
function render(){const t=words[lang];$('navtitle').textContent=t.nav;$('monthtitle').textContent=t.month(year,month);$('hint').textContent=t.hint;$('disclaimer').textContent=t.disclaimer;const c=$('calendar');c.innerHTML='';t.days.forEach(x=>{let e=document.createElement('div');e.className='weekday';e.textContent=x;c.append(e)});let first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++){let d=document.createElement('div');d.className='day blank';c.append(d)}for(let i=1;i<=total;i++){let ds=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,items=entries.filter(x=>x.date===ds),b=document.createElement('button');b.className='day'+(selected===ds?' selected':'');b.innerHTML=`<div class="num">${i}</div>`+items.slice(0,2).map(x=>`<div class="chip ${esc(x.type)}">${esc(lang==='zh'?(x.titlezh||x.titleko):x.titleko)}</div>`).join('')+(items.length>2?`<div class="chip">+${items.length-2}</div>`:'');b.onclick=()=>{selected=selected===ds?null:ds;render()};c.append(b)}$('eventtitle').textContent=t.events+(selected?' · '+selected:'');let list=entries.filter(x=>x.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)&&(!selected||x.date===selected)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('events').innerHTML=list.length?list.map(x=>`<article class="event">${x.image&&/^https:\/\//.test(x.image)?`<img class="poster" src="${esc(x.image)}" alt="poster">`:'<div class="poster">XIA</div>'}<div style="min-width:0;flex:1"><span class="tag">${t.types[x.type]||t.types.other}</span><h4>${esc(lang==='zh'?(x.titlezh||x.titleko):x.titleko)}</h4><p>📅 ${esc(x.date)} ${esc(x.time||'')}</p>${x.placeko?`<p>📍 ${esc(lang==='zh'?(x.placezh||x.placeko):x.placeko)}</p>`:''}${(lang==='zh'?(x.desczh||x.descko):x.descko)?`<p>${esc(lang==='zh'?(x.desczh||x.descko):x.descko)}</p>`:''}${x.link&&/^https:\/\//.test(x.link)?`<p><a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${lang==='ko'?'상세 보기':'查看详情'}</a></p>`:''}${admin?`<div class="editactions"><button onclick="editItem('${esc(x.id)}')">수정</button><button onclick="deleteItem('${esc(x.id)}')">삭제</button></div>`:''}</div></article>`).join(''):`<p class="muted">${t.empty}</p>`}
function toggleAdmin(){admin=!admin;$('editor').hidden=!admin;$('adminBtn').textContent=admin?'⚙ 관리자 닫기':'⚙ 관리자';render();if(admin)$('editor').scrollIntoView({behavior:'smooth'})}function resetForm(){$('eventform').reset();$('editid').value='';$('date').value=`${year}-${String(month+1).padStart(2,'0')}-01`;$('status').textContent=''}function editItem(id){let x=entries.find(e=>e.id===id);if(!x)return;['date','time','titleko','titlezh','placeko','placezh','type','descko','desczh','image','link'].forEach(k=>$(k).value=x[k]||'');$('editid').value=id;$('editor').scrollIntoView({behavior:'smooth'})}function deleteItem(id){if(!confirm('이 일정을 삭제할까요?'))return;entries=entries.filter(x=>x.id!==id);save();render()}
$('eventform').onsubmit=e=>{e.preventDefault();let x={};['date','time','titleko','titlezh','placeko','placezh','type','descko','desczh','image','link'].forEach(k=>x[k]=$(k).value.trim());x.id=$('editid').value||('id'+Date.now());let i=entries.findIndex(v=>v.id===x.id);if(i>=0)entries[i]=x;else entries.push(x);let d=x.date.split('-');year=+d[0];month=+d[1]-1;selected=null;save();resetForm();render();$('status').textContent='이 브라우저에 저장했습니다. 공개 사이트 전체에는 자동 반영되지 않습니다.'};
function exportData(){let blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='XIA_schedule_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!Array.isArray(v)||!v.every(x=>x.id&&x.date&&x.titleko))throw Error('잘못된 형식');if(confirm('현재 일정을 백업 파일 내용으로 교체할까요?')){entries=v;save();render();$('status').textContent='불러오기 완료'}}catch(err){alert('올바른 JSON 백업 파일이 아닙니다.')}e.target.value=''};reader.readAsText(f)}resetForm();render();
</script></body></html>
